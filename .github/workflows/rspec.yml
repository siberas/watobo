name: RSpec

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fxruby links against the FOX C++ toolkit and a stack of X11/GL/image
      # dev libs. nfqueue links against libnetfilter_queue. The RSpec suite
      # itself never opens an X display (spec_helper does not require 'fox16'),
      # so xvfb is not needed here.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfox-1.6-dev \
            libnetfilter-queue-dev \
            libnfnetlink-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            freeglut3-dev \
            libglu1-mesa-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libbz2-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rake
